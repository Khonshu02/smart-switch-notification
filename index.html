
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Switch Notifications</title>
</head>
<body>
  <h1>IoT Smart Switch</h1>
  <p>Notification permission: <span id="permission">Checking...</span></p>

  <button onclick="notifySwitch('ON')">Test ON notification</button>
  <button onclick="notifySwitch('OFF')">Test OFF notification</button>

  <script>
    async function enableNotifications() {
      if (!("Notification" in window)) {
        document.getElementById("permission").textContent =
          "Not supported";
        return;
      }

      if (Notification.permission === "default") {
        await Notification.requestPermission();
      }

      document.getElementById("permission").textContent =
        Notification.permission;
    }

    function notifySwitch(state) {
      if (Notification.permission !== "granted") {
        alert("Please enable notifications first.");
        return;
      }

      new Notification("IoT Smart Switch", {
        body: "LED turned " + state + " (test notification)"
      });
    }

    enableNotifications();
  </script>
  
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration =
            await navigator.serviceWorker.register("./sw.js");
          
          console.log("Service worker registered:", registration.scope);
        } catch (error) {
          console.error("Service worker registration failed:", error);
        }
      });
   }
  </script>
</body>
</html>
